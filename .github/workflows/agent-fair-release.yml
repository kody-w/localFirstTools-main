name: Release Agent World's Fair

on:
  workflow_dispatch:
    inputs:
      bundle_digest:
        description: Verified fair bundle SHA-256 digest
        required: true
        type: string
      district_digest:
        description: Verified fair district SHA-256 digest
        required: true
        type: string
      customer_approved:
        description: Customer approval to propose the public release frame
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: repository-writer-agent-fair-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: agent-fair-production
    env:
      RELEASE_BRANCH: release/agent-fair-${{ github.run_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Acquire repository writer lock
        run: python3 scripts/repository_lock.py acquire --timeout 2700
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create release branch from latest main
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.sha }}"
          git checkout -b "$RELEASE_BRANCH" origin/main

      - name: Install Python test runner
        run: python3 -m pip install --disable-pip-version-check pytest==8.3.5

      - name: Install locked browser dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Require explicit customer approval input
        shell: bash
        run: test "${{ inputs.customer_approved }}" = "true"

      - name: Prepare and verify deterministic release candidate
        run: |
          python3 scripts/agent_world_fair.py release
          python3 scripts/agent_world_fair.py verify

      - name: Apply OIDC-attested customer-approved release
        run: >-
          python3 scripts/agent_world_fair.py apply-release
          --bundle-digest "${{ inputs.bundle_digest }}"
          --district-digest "${{ inputs.district_digest }}"

      - name: Generate public feeds
        run: python3 scripts/generate_feeds.py --verbose

      - name: Build syndication
        run: python3 scripts/build_syndication.py

      - name: Run released-phase tests and gates
        run: |
          python3 -m pytest -v scripts/tests/test_agent_world_fair.py
          python3 -m pytest -v scripts/tests/test_observatory_security.py
          python3 scripts/agent_fair_gate.py --phase released --json

      - name: Stage only generated release artifacts
        shell: bash
        run: |
          git add -- \
            .well-known/feeddata-toc \
            .well-known/rappterzoo-syndication \
            apps/agent-fair/release-candidate.json \
            apps/feed.json \
            apps/feed.xml \
            apps/organism-frames.json \
            apps/organism-frames.jsonl \
            apps/syndication/
          allowed='^(\.well-known/(feeddata-toc|rappterzoo-syndication)|apps/agent-fair/release-candidate\.json|apps/feed\.(json|xml)|apps/organism-frames\.(json|jsonl)|apps/syndication/)'
          unexpected_staged="$(git diff --cached --name-only | grep -Ev "$allowed" || true)"
          unexpected_unstaged="$(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | grep -Ev "$allowed" || true
          )"
          test -z "$unexpected_staged"
          test -z "$unexpected_unstaged"

      - name: Commit generated release proposal
        id: commit
        shell: bash
        run: |
          if git diff --cached --quiet; then
            echo "Agent fair release proposal is already current."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "rappterzoo-agent-fair-release"
            git config user.email "rappterzoo-agent-fair-release@users.noreply.github.com"
            git commit \
              -m "release: propose Agent World's Fair" \
              -m "Approved through GitHub Actions OIDC and the agent-fair-production environment." \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push release branch
        if: steps.commit.outputs.has_changes == 'true'
        shell: bash
        run: |
          git fetch origin "$RELEASE_BRANCH" || true
          git push --force-with-lease origin "HEAD:refs/heads/$RELEASE_BRANCH"

      - name: Generate bounded release attestation
        if: steps.commit.outputs.has_changes == 'true'
        run: >-
          python3 scripts/verify_agent_fair_release_attestation.py create
          --base-sha "${{ github.sha }}"
          --release-commit-sha "$(git rev-parse HEAD)"
          --output "${RUNNER_TEMP}/agent-fair-release-attestation.json"

      - name: Upload deterministic release attestation
        if: steps.commit.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-fair-release-attestation-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-fair-release-attestation.json
          if-no-files-found: error
          retention-days: 30

      - name: Create or update release pull request
        if: steps.commit.outputs.has_changes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate_digest="$(
            python3 -c "import json; print(json.load(open('apps/agent-fair/release-candidate.json'))['candidate_digest'])"
          )"
          attestation_sha="$(
            python3 -c "import json,os; print(json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'agent-fair-release-attestation.json')))['attestation_sha256'])"
          )"
          body="Proposes the Agent World's Fair public release frame.

          - Candidate: \`$candidate_digest\`
          - Bundle: \`${{ inputs.bundle_digest }}\`
          - District: \`${{ inputs.district_digest }}\`
          - OIDC attestation SHA-256: \`$attestation_sha\`
          - Artifact: \`agent-fair-release-attestation-${{ github.run_id }}\`
          - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The frame remains sig:null and structural-unverified. GitHub OIDC proves the protected workflow context; main branch protection and PR review remain the final publication authority."
          number="$(
            gh pr list \
              --base main \
              --head "$RELEASE_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if test -n "$number"; then
            gh pr edit "$number" \
              --title "Release Agent World's Fair" \
              --body "$body"
          else
            gh pr create \
              --base main \
              --head "$RELEASE_BRANCH" \
              --title "Release Agent World's Fair" \
              --body "$body"
          fi

      - name: Dispatch required release pull request checks
        shell: bash
        run: |
          number="$(
            gh pr list \
              --base main \
              --head "$RELEASE_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          test -n "$number"
          base_sha="$(git rev-parse origin/main)"
          head_sha="$(git rev-parse HEAD)"
          gh workflow run moonshot-gate.yml --ref "$RELEASE_BRANCH"
          gh workflow run agent-fair-release-attestation.yml \
            --ref "$RELEASE_BRANCH" \
            -f pr_number="$number" \
            -f base_sha="$base_sha" \
            -f head_sha="$head_sha" \
            -f head_ref="$RELEASE_BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Release repository writer lock
        if: always()
        run: python3 scripts/repository_lock.py release
        env:
          GH_TOKEN: ${{ github.token }}
