name: Moltbook Heartbeat
on:
  schedule:
    - cron: '45 1,7,13,19 * * *'  # 4x daily, offset from other workflows
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'full'
        type: choice
        options: ['full', 'post-only', 'engage-only']
      dry_run:
        description: 'Dry run (no API calls)'
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Acquire repository writer lock
        run: python3 scripts/repository_lock.py acquire --timeout 2700
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh main after lock
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Configure git
        run: |
          git config user.name "rappterzoo-heartbeat"
          git config user.email "rappterzoo-heartbeat@rappterzoo.dev"

      - name: Run Moltbook heartbeat
        id: heartbeat
        run: |
          if [ -z "$MOLTBOOK_API_KEY" ]; then
            echo "::warning::MOLTBOOK_API_KEY secret not set — skipping heartbeat run"
            echo "To enable this workflow, add the MOLTBOOK_API_KEY secret in repo settings."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          MODE="${{ github.event.inputs.mode || 'full' }}"
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          FLAGS="--verbose"
          if [ "$DRY" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ "$MODE" = "post-only" ]; then FLAGS="$FLAGS --post-only"; fi
          if [ "$MODE" = "engage-only" ]; then FLAGS="$FLAGS --engage-only"; fi
          python3 scripts/moltbook_heartbeat.py $FLAGS
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}

      - name: Commit state
        if: steps.heartbeat.outputs.skipped != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          for f in apps/moltbook-heartbeat-state.json apps/activity-log.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "heartbeat: Moltbook engagement run"
            git push
          fi

      - name: Release repository writer lock
        if: always()
        run: python3 scripts/repository_lock.py release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
