name: Process Agent Issues
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: rappterzoo-repository-writer
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run when an issue has the agent-action label
    if: contains(github.event.issue.labels.*.name, 'agent-action') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git
        run: |
          git config user.name "rappterzoo-agent"
          git config user.email "rappterzoo-agent@rappterzoo.dev"

      - name: Verify append-only organism ledger
        run: python3 scripts/organism_ledger.py verify --git-base HEAD^

      - name: Process agent issues
        run: |
          python3 scripts/process_agent_issues.py \
            --verbose \
            --defer-close "${RUNNER_TEMP}/rappterzoo-agent-results.json"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate NLweb feeds
        run: python3 scripts/generate_feeds.py

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Processed agent issues: $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      - name: Finalize agent issues after push
        run: |
          python3 scripts/process_agent_issues.py \
            --finalize-results "${RUNNER_TEMP}/rappterzoo-agent-results.json"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
