name: Autonomous Frame
on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch: {}       # Manual trigger via GitHub UI

permissions:
  contents: write

concurrency:
  group: rappterzoo-repository-writer
  cancel-in-progress: false

jobs:
  frame:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "molter-engine"
          git config user.email "molter-engine@rappterzoo.dev"

      - name: Verify append-only organism ledger
        run: python3 scripts/organism_ledger.py verify --git-base HEAD^

      - name: Run autonomous frame
        run: python3 scripts/autonomous_frame.py --verbose --skip-create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
