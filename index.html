<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RappterZoo - 640 Autonomous Apps</title>
<meta name="description" content="RappterZoo: an autonomous platform of 640 self-contained AI-made apps. Watch the 4-minute documentary, then browse the gallery.">
<link rel="alternate" type="application/rss+xml" title="RappterZoo Feed" href="apps/feed.xml">
<link rel="alternate" type="application/feed+json" title="RappterZoo Feed (JSON)" href="apps/feed.json">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "RappterZoo",
  "url": "https://kody-w.github.io/localFirstTools-main/",
  "description": "Autonomous content platform of 640 self-contained, local-first HTML apps. Documentary first, then full app gallery.",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://kody-w.github.io/localFirstTools-main/apps/gallery.html?q={search_term_string}",
    "query-input": "required name=search_term_string"
  },
  "hasPart": {
    "@type": "DataCatalog",
    "name": "RappterZoo App Catalog",
    "dataset": {
      "@type": "DataFeed",
      "name": "RappterZoo App Feed",
      "url": "https://kody-w.github.io/localFirstTools-main/apps/feed.json"
    }
  }
}
</script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; background: #000; color: #e6ecf2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
#doc-frame {
  position: fixed; inset: 0; width: 100vw; height: 100vh;
  border: 0; background: #000;
}
/* Big banner shown for first 5 seconds */
#big-banner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10000;
  display: flex; justify-content: center; align-items: center; gap: 18px;
  padding: 18px 24px;
  background: linear-gradient(135deg, rgba(0, 229, 255, 0.95), rgba(255, 138, 61, 0.95));
  color: #001520; font-weight: 700; letter-spacing: 0.04em;
  font-size: 17px;
  box-shadow: 0 8px 40px rgba(0, 229, 255, 0.35);
  animation: bannerIn 0.6s ease-out, bannerOut 1.2s ease-in 4.0s forwards;
  text-align: center;
}
@keyframes bannerIn { from { transform: translateY(-100%); } to { transform: translateY(0); } }
@keyframes bannerOut { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-110%); opacity: 0; } }
#big-banner a {
  background: #001520; color: #00e5ff; text-decoration: none;
  padding: 10px 22px; border-radius: 999px; font-weight: 800;
  letter-spacing: 0.06em; text-transform: uppercase; font-size: 15px;
  white-space: nowrap;
}
#big-banner a:hover { background: #002030; }
/* Persistent corner link after banner fades */
#corner-link {
  position: fixed; top: 18px; right: 18px; z-index: 10001;
  background: rgba(0, 21, 32, 0.85); backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: #00e5ff; text-decoration: none;
  padding: 10px 18px; border-radius: 999px;
  border: 1px solid rgba(0, 229, 255, 0.4);
  font-weight: 700; font-size: 13px; letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0; pointer-events: none;
  transition: opacity 0.5s ease, transform 0.3s ease;
  animation: cornerIn 0.6s ease 5.2s forwards;
}
@keyframes cornerIn { to { opacity: 1; pointer-events: auto; } }
#corner-link:hover { background: rgba(0, 229, 255, 0.15); transform: translateY(-1px); }
#fallback {
  position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
  background: #0a0e16; padding: 40px; text-align: center; z-index: 5;
}
#fallback.show { display: flex; }
#fallback a {
  color: #00e5ff; text-decoration: none; font-weight: 700;
  background: rgba(0, 229, 255, 0.1); border: 1px solid rgba(0, 229, 255, 0.3);
  padding: 14px 30px; border-radius: 999px; margin-top: 20px; display: inline-block;
}
@media (prefers-reduced-motion: reduce) {
  #big-banner { animation: none; }
  #corner-link { opacity: 1; pointer-events: auto; animation: none; }
}
</style>
</head>
<body>
<div id="big-banner">
  <span>WELCOME TO RAPPTERZOO &mdash; 640 AUTONOMOUS APPS &mdash;</span>
  <a href="apps/gallery.html">Browse all 640 apps &rarr;</a>
</div>

<a id="corner-link" href="apps/gallery.html">Browse all 640 apps &rarr;</a>

<iframe id="doc-frame" src="apps/documentary/zoo-documentary.html" title="RappterZoo Documentary" allow="autoplay; fullscreen"></iframe>

<div id="fallback" role="status">
  <div>
    <h1 style="font-size:28px;margin-bottom:12px">RappterZoo</h1>
    <p style="color:#8b97a8;max-width:520px;line-height:1.5">The documentary could not load. Browse the full catalog of 640 self-contained apps below.</p>
    <a href="apps/gallery.html">Open the gallery &rarr;</a>
  </div>
</div>

<script>
// Fallback: if the documentary iframe fails to load within 8 seconds, show fallback panel.
// Manifest fetch is preserved as a sanity-check probe so the page works standalone.
(function(){
  var loaded = false;
  var iframe = document.getElementById('doc-frame');
  iframe.addEventListener('load', function(){ loaded = true; });
  iframe.addEventListener('error', function(){ document.getElementById('fallback').classList.add('show'); });
  setTimeout(function(){
    if (!loaded) {
      // probe manifest to confirm the static site is alive (graceful fallback)
      fetch('apps/manifest.json').then(function(r){
        if (r && r.ok) {
          // documentary slow but site is up; nudge to gallery
          document.getElementById('fallback').classList.add('show');
        } else {
          document.getElementById('fallback').classList.add('show');
        }
      }).catch(function(){ document.getElementById('fallback').classList.add('show'); });
    }
  }, 8000);
})();
</script>
</body>
</html>
